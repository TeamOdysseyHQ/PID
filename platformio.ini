; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

build_flags = 
    -L .pio/libdeps/teensy41/micro_ros_arduino/src/imxrt1062/fpv5-d16-hard/
    -l microros
    -D MICRO_ROS_TRANSPORT_ARDUINO_SERIAL

lib_deps =
    https://github.com/micro-ROS/micro_ros_arduino
    https://github.com/Dlloydev/QuickPID
    https://github.com/Dlloydev/sTune
    mikalhart/TinyGPSPlus
    https://github.com/Richard-Gemmell/teensy4_i2c.git#v1.1.0
